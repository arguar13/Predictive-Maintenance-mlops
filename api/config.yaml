project:
  name: "predictive_maintenance_turbofan"
  version: "2.0.0"

kafka:
  broker: "${KAFKA_BROKER}"  # Inyectado por K8s ConfigMap
  telemetry_topic: "engine_telemetry"
  alert_topic: "engine_alerts"

model:
  window_size: 30
  # Ver la nota equivalente en config/config.yaml: 24 es el valor real del
  # modelo champion entrenado sobre el dataset completo (FD001-FD004), no el
  # historico 14 de data_toy/. api/main.py ignora este valor en runtime
  # (infiere la forma real desde scaler.n_features_in_ del modelo servido);
  # se mantiene solo como fallback/documentacion.
  num_features: 24
  mlflow_tracking_uri: "${MLFLOW_TRACKING_URI}"  # Inyectado por K8s
  model_name: "Turbofan_FCN"

monitoring:
  prometheus_port: 8000
  drift_threshold: 0.05
  accuracy_threshold: 0.85
