stages:
  - quality
  - smoke_test
  - data_pull
  - train
  - build
  - release

variables:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "040175285118"
  AWS_ROLE_ARN: arn:aws:iam::040175285118:role/GitLabCIRole
  # Version anclada de Poetry: debe coincidir con la usada para generar los
  # poetry.lock (ver cabecera de api/poetry.lock y core_ml/poetry.lock) para
  # garantizar que local, CI y Docker resuelvan exactamente el mismo entorno.
  POETRY_VERSION: "2.4.1"
  # Version anclada de Trivy para el escaneo de secretos/vulnerabilidades/IaC.
  TRIVY_VERSION: "0.69.3"

default:
  image: python:3.12-slim
  # Fuerza TODOS los jobs al runner self-hosted (hardware local, ver runner/)
  # en vez de a los shared runners de gitlab.com: cero minutos de la cuota
  # compartida consumidos. Requiere un runner registrado con este tag
  # (make runner-register TOKEN=glrt-xxx && make runner-up).
  tags:
    - local-hardware
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com

.aws_auth: &aws_auth
  before_script:
    - >
      if command -v apt-get >/dev/null 2>&1; then
        apt-get update && apt-get install -y awscli jq curl
      elif command -v apk >/dev/null 2>&1; then
        apk add --no-cache aws-cli jq curl
      fi
    - >
      aws sts assume-role-with-web-identity
      --role-arn $AWS_ROLE_ARN
      --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
      --web-identity-token "$AWS_OIDC_TOKEN" > /tmp/assume-role.json
    - export AWS_ACCESS_KEY_ID=$(jq -r '.Credentials.AccessKeyId' /tmp/assume-role.json)
    - export AWS_SECRET_ACCESS_KEY=$(jq -r '.Credentials.SecretAccessKey' /tmp/assume-role.json)
    - export AWS_SESSION_TOKEN=$(jq -r '.Credentials.SessionToken' /tmp/assume-role.json)

quality:
  stage: quality
  script:
    # git es imprescindible: pre-commit (yamllint) lo invoca para enumerar
    # archivos versionados, y python:3.12-slim no lo trae preinstalado.
    - apt-get update && apt-get install -y --no-install-recommends make curl git
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"
    - pip install "poetry==${POETRY_VERSION}" pre-commit
    - make install
    - make ci

smoke_test:
  # Fase 2: valida el pipeline End-to-End (contratos de datos, prepare_feast_data,
  # entrenamiento, registro en MLflow) contra el dataset toy (~1000 filas,
  # versionado con DVC) ANTES de gastar computo real (Feast/S3 + dataset
  # completo + GPU) en el stage "train". Usa un tracking URI de MLflow
  # efímero (SQLite local): es un smoke test del pipeline, no un
  # entrenamiento que deba promoverse al Model Registry compartido.
  stage: smoke_test
  # needs (DAG explicito) en vez de confiar solo en el orden de "stages": sin
  # needs, GitLab no bloquea "train_model"/"build_image"/"release" cuando un
  # stage anterior falla. Ademas, cada job SOLIA declarar `rules: - when:
  # always` (ya retirado de los 5 jobs de este archivo): esa combinacion es
  # una trampa documentada de GitLab -- "when: always" hace que el job se
  # ejecute igual aunque el job del que depende (needs) haya quedado
  # "skipped" (no "failed"), porque el skip no se propaga como un fallo. Con
  # ese `rules` de por medio, un job podia arrancar con needs: [X] incluso
  # con X en "skipped", que es exactamente lo que se observo dos veces:
  # train_model:running con smoke_test:failed (y pull_data de por medio en
  # "skipped"). Sin `rules` (inclusion por defecto, identica a "when:
  # always" para el proposito de este pipeline) needs bloquea correctamente
  # toda la cadena quality -> smoke_test -> pull_data -> train_model ->
  # build_image -> release ante cualquier fallo.
  needs: ["quality"]
  <<: *aws_auth
  script:
    - pip install "poetry==${POETRY_VERSION}"
    - cd core_ml
    - poetry install --with dev --no-interaction
    - poetry run dvc pull data_toy
    - poetry run python src/prepare_feast_data.py --data-dir data_toy
    # export en el script, NO `variables:` de job: las variables de CI/CD del
    # proyecto (Settings > CI/CD > Variables, p.ej. la MLFLOW_TRACKING_URI que
    # usa train_model para el MLflow real) tienen mayor precedencia que las
    # `variables:` a nivel de job en este archivo, asi que un bloque
    # `variables:` aqui NUNCA gana. Sin este export, smoke_test terminaba
    # hablandole al MLflow real via la URI de train_model y fallaba con 403
    # "Invalid Host header" (ese MLflow solo permite los hosts de
    # kubernetes/base/mlflow.yaml). smoke_test es un test de humo: SIEMPRE
    # debe usar un tracking store SQLite efimero, nunca el Model Registry
    # real ni nada configurado externamente.
    - export MLFLOW_TRACKING_URI="sqlite:////tmp/mlflow_smoke_test.db"
    - poetry run python src/train.py --data-dir data_toy --data-source parquet --no-enforce-quality-gate

pull_data:
  stage: data_pull
  needs: ["smoke_test"]
  <<: *aws_auth
  script:
    - pip install dvc dvc-s3
    - cd core_ml
    - dvc pull
  artifacts:
    paths:
      - core_ml/data/

train_model:
  stage: train
  needs: ["pull_data"]
  <<: *aws_auth
  # MLFLOW_TRACKING_URI se toma de una variable de CI/CD del proyecto
  # (Settings > CI/CD > Variables) apuntando al MLflow compartido y
  # persistente (el mismo que sirve la API, ver kubernetes/base/configmap.yaml:
  # MLFLOW_TRACKING_URI). Es IMPRESCINDIBLE configurarla con un endpoint
  # alcanzable desde el runner (p.ej. un Load Balancer interno/privado);
  # si no está definida, se cae a un SQLite efímero SOLO para no romper el
  # pipeline -- ese modo NO registra nada en el Model Registry real que
  # sirve la API, así que ningún modelo entrenado así llega a producción.
  script:
    - pip install "poetry==${POETRY_VERSION}"
    - export MLFLOW_TRACKING_URI="${MLFLOW_TRACKING_URI:-sqlite:////tmp/mlflow.db}"
    - >
      if [ "$MLFLOW_TRACKING_URI" = "sqlite:////tmp/mlflow.db" ]; then
        echo "ADVERTENCIA: MLFLOW_TRACKING_URI no configurado; usando un tracking store SQLite efímero. Este modelo NO quedará disponible para la API. Configura la variable de CI/CD MLFLOW_TRACKING_URI con el endpoint real de MLflow.";
      fi
    - cd core_ml
    - poetry install
    # Paso faltante hasta ahora: --data-source feast exige que (a) el
    # parquet fuente exista en S3 en la ruta que feature_store/features.py
    # declara (FileSource), y (b) el FeatureView este registrado en el
    # registry de Feast (tambien en S3, feature_store.yaml: registry.path).
    # Sin esto, get_historical_features fallaba con
    # FeatureViewNotFoundException: la definicion de features.py nunca habia
    # llegado a aplicarse contra un registry real.
    - poetry run python src/prepare_feast_data.py --data-dir data
    - aws s3 cp data/engine_features.parquet "s3://predictive-maintenance-mlops-artifacts-${AWS_ACCOUNT_ID}/feast/data/engine_features.parquet"
    - poetry run feast -c feature_store apply
    # --epochs 25 es un TECHO, no un objetivo: --patience 5 corta el
    # entrenamiento en cuanto 5 epochs seguidos no mejoran val_accuracy, y
    # siempre se restaura el mejor checkpoint (nunca el ultimo epoch). El
    # default de train.py (epochs=3) es el valor que usa smoke_test para
    # correr en segundos contra el toy dataset -- nunca penso para entrenar
    # de verdad. Validado localmente contra el dataset completo real con el
    # modelo ConvTransformer (reemplazo del FCN baseline; benchmark propio
    # sobre 5 arquitecturas): early stopping corta en epoch ~15,
    # val_accuracy ~0.907 (accuracy_threshold es 0.85). Reproducible entre
    # corridas: train.py fija torch.manual_seed(42).
    - poetry run python src/train.py --data-dir data --data-source feast --epochs 25 --patience 5

build_image:
  # Construye y publica las CUATRO imagenes (api + streaming-consumer +
  # monitoring + mlflow). El tag es siempre $CI_COMMIT_SHA, nunca "latest":
  # es la referencia inmutable que el stage "release" fija en el overlay de
  # Kustomize. `make docker-buildx-push` (no docker-build+docker-push): usa
  # cache remoto de BuildKit en ECR, ver su comentario en el Makefile.
  #
  # SIN servicio dind (cambio de arquitectura): antes este job usaba
  # `services: docker:24.0.5-dind`, un daemon Docker EFIMERO por job -- cada
  # intento (y cada reintento) arrancaba con /var/lib/docker completamente
  # vacio, obligando a redescargar/reconstruir desde cero la capa pesada de
  # torch (~1GB+) contra una red domestica que se corta con frecuencia
  # (confirmado por el usuario). Ahora el job monta el socket del daemon
  # REAL del host (`/var/run/docker.sock`, configurado a nivel de runner en
  # /etc/gitlab-runner/config.toml -> [runners.docker] volumes) -- el mismo
  # daemon persistente que sigue vivo entre corridas. El builder de buildx
  # (`ci-builder`, mas abajo) tambien se reutiliza entre corridas en vez de
  # recrearse siempre, asi que su cache de capas sobrevive de un pipeline al
  # siguiente: solo la primera corrida en frio paga el costo completo de
  # red; las siguientes casi no dependen de la red para lo que no cambio.
  # Efecto secundario positivo: ya no hace falta `privileged: true` a nivel
  # de runner solo para este job (dind si lo requeria; hablar con el daemon
  # del host por su socket, no).
  stage: build
  needs: ["train_model"]
  # 2h += margen para la primera corrida en frio tras este cambio de
  # arquitectura (aun sin nada cacheado en el builder persistente); una vez
  # poblado el cache, las corridas siguientes deberian terminar en minutos.
  timeout: 2h
  image: docker:24.0.5
  <<: *aws_auth
  script:
    - apk add --no-cache make
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
    # --driver docker-container (no el driver "docker" default): es el unico
    # que soporta el exporter de cache "type=registry" que usa
    # docker-buildx-push (Makefile) -- sin el, --cache-to falla o se ignora
    # en silencio y cada corrida vuelve a subir la capa de torch entera.
    # --name ci-builder (fijo, no autogenerado) + `buildx inspect` antes de
    # crear: si el builder de una corrida anterior sigue vivo en el daemon
    # del host (persistente, ver comentario de arriba), se reutiliza tal
    # cual -- crearlo de nuevo cada vez tirar[ia] su cache de capas.
    - docker buildx inspect ci-builder >/dev/null 2>&1 || docker buildx create --name ci-builder --driver docker-container
    - docker buildx use ci-builder
    # Resiliencia observada empiricamente en este runner self-hosted (red
    # domestica que se corta con frecuencia, confirmado por el usuario): el
    # push de buildkitd hacia ECR a veces deja de emitir progreso a mitad de
    # una capa y el proceso queda colgado indefinidamente -- la conexion TCP
    # muere sin FIN/RST. `timeout` por si solo NO alcanza: mata el proceso
    # CLIENTE (`docker buildx build`), pero el daemon buildkitd que ejecuta
    # el push de verdad corre en un contenedor aparte
    # (buildx_buildkit_ci-builder0) y sigue atascado del lado servidor
    # aunque el cliente muera -- un reintento contra el MISMO builder
    # hereda el mismo atasco. Por eso cada reintento recrea el builder por
    # completo (`buildx rm` + `buildx create`), lo que mata y repone el
    # buildkitd atascado (esto SI descarta el cache local de ese builder,
    # a diferencia de la reutilizacion entre pipelines de arriba -- es el
    # precio de garantizar que el siguiente intento no herede un daemon
    # muerto); el cache remoto en ECR (--cache-from/--cache-to
    # type=registry) y el skip-if-exists del Makefile (imagenes ya
    # publicadas en un intento previo) hacen que igual sea barato.
    # `timeout -k 30` fuerza SIGKILL 30s despues de un SIGTERM ignorado.
    #
    # 20 min por intento (antes 10): confirmado en produccion que 10 min no
    # alcanzaban para un ciclo completo en frio (sin cache local) -- el
    # timeout cortaba intentos que en realidad seguian progresando, solo
    # lento. Backoff creciente entre reintentos (30s/60s/120s/240s, tope
    # 300s) en vez de reintentar al instante: le da tiempo a una conexion
    # inestable de estabilizarse antes del siguiente intento. 5 intentos de
    # 20 min (100 min) + backoff (max ~12.5 min) siempre dentro de las 2h de
    # `timeout:` del job.
    - |
      run_with_retry() {
        attempts=5
        per_attempt_timeout=1200
        backoff=30
        max_backoff=300
        n=1
        until timeout -k 30 "$per_attempt_timeout" "$@"; do
          if [ "$n" -ge "$attempts" ]; then
            echo "ERROR: comando fallo tras $attempts intentos (cada uno cortado a los ${per_attempt_timeout}s): $*" >&2
            return 1
          fi
          echo "AVISO: intento $n/$attempts fallo o se colgo (posible conexion TCP muerta hacia ECR); esperando ${backoff}s antes de recrear el builder de buildx (mata cualquier buildkitd atascado) y reintentar..."
          sleep "$backoff"
          backoff=$((backoff * 2))
          if [ "$backoff" -gt "$max_backoff" ]; then
            backoff=$max_backoff
          fi
          docker buildx rm ci-builder >/dev/null 2>&1 || true
          docker buildx create --use --name ci-builder --driver docker-container
          n=$((n + 1))
        done
      }
      run_with_retry make docker-buildx-push AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID AWS_REGION=$AWS_REGION IMAGE_TAG=$CI_COMMIT_SHA

release:
  # GitOps, no despliegue imperativo: este job NO habla con el cluster (sin
  # kubectl, sin `aws eks update-kubeconfig`, sin credenciales de EKS). Solo
  # fija el tag de imagen en kubernetes/overlays/production de forma
  # declarativa (`kustomize edit set image`, ver Makefile) y commitea el
  # cambio a git. ArgoCD (gitops/argocd/application.yaml), que vigila esa
  # ruta dentro del cluster, detecta el commit y sincroniza -- el pipeline
  # de CI nunca vuelve a tocar el cluster directamente.
  #
  # Requiere que el runner pueda pushear a este repo: por defecto GitLab
  # configura el remote "origin" con el CI_JOB_TOKEN del propio pipeline. Dos
  # permisos DISTINTOS pueden bloquear ese push, e independientes entre si:
  #   1. Si la rama esta protegida, "Allowed to push" para el rol
  #      "Maintainer"/CI en Settings > Repository > Protected branches.
  #   2. Settings > CI/CD > Job token permissions > "Allow this project's job
  #      tokens to push to this project's repository" (API:
  #      ci_push_repository_for_job_token_allowed). Este es el que realmente
  #      bloqueaba el push en "dev" (rama SIN proteger): GitLab rechaza el
  #      push del CI_JOB_TOKEN con 403 "You are not allowed to push code to
  #      this project" si este segundo ajuste esta deshabilitado, sin
  #      importar el estado de branch protection.
  stage: release
  needs: ["build_image"]
  image: alpine:3.20
  script:
    - apk add --no-cache make git curl bash
    - curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
    - git config user.email "gitlab-ci@$(echo "$CI_PROJECT_PATH" | tr '/' '.')"
    - git config user.name "GitLab CI"
    - make gitops-release AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID AWS_REGION=$AWS_REGION IMAGE_TAG=$CI_COMMIT_SHA
