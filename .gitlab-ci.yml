stages:
  - lint_test
  - build_push
  - deploy
  - train

variables:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "040175285118"
  AWS_ROLE_ARN: arn:aws:iam::040175285118:role/GitLabCIRole
  EKS_CLUSTER_NAME: predictive-maintenance-mlops
  # Version anclada de Poetry: debe coincidir con la usada para generar los
  # poetry.lock (ver cabecera de api/poetry.lock y core_ml/poetry.lock) para
  # garantizar que local, CI y Docker resuelvan exactamente el mismo entorno.
  POETRY_VERSION: "2.4.1"

default:
  image: python:3.12-slim
  # Runner generico: cualquier runner (compartido de gitlab.com o propio)
  # que pueda correr jobs Docker sirve. Ajusta esto si tu organizacion usa
  # runners con un tag especifico.
  tags: []
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com

# Autenticacion contra AWS via OIDC (sin credenciales estaticas de larga
# duracion): GitLab emite un id_token JWT que se canjea por credenciales
# temporales asumiendo GitLabCIRole (ver terraform/iam.tf).
.aws_auth: &aws_auth
  before_script:
    - >
      if command -v apt-get >/dev/null 2>&1; then
        apt-get update && apt-get install -y --no-install-recommends awscli jq curl
      elif command -v apk >/dev/null 2>&1; then
        apk add --no-cache aws-cli jq curl
      fi
    - >
      aws sts assume-role-with-web-identity
      --role-arn $AWS_ROLE_ARN
      --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
      --web-identity-token "$AWS_OIDC_TOKEN" > /tmp/assume-role.json
    - export AWS_ACCESS_KEY_ID=$(jq -r '.Credentials.AccessKeyId' /tmp/assume-role.json)
    - export AWS_SECRET_ACCESS_KEY=$(jq -r '.Credentials.SecretAccessKey' /tmp/assume-role.json)
    - export AWS_SESSION_TOKEN=$(jq -r '.Credentials.SessionToken' /tmp/assume-role.json)

# ---------------------------------------------------------------------------
# 1. lint_test: ruff + pytest en api/ y core_ml/
# ---------------------------------------------------------------------------
lint_test:
  stage: lint_test
  script:
    - apt-get update && apt-get install -y --no-install-recommends make git
    - pip install "poetry==${POETRY_VERSION}"
    - make install
    - make lint
    - make test

# ---------------------------------------------------------------------------
# 2. build_push: build + push de la imagen de la API a ECR
# ---------------------------------------------------------------------------
build_push:
  stage: build_push
  needs: ["lint_test"]
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  <<: *aws_auth
  script:
    - apk add --no-cache make
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
    - make docker-build IMAGE_TAG=$CI_COMMIT_SHA
    - make docker-push IMAGE_TAG=$CI_COMMIT_SHA

# ---------------------------------------------------------------------------
# 3. deploy: aplica el overlay de Kustomize directo contra el cluster
# ---------------------------------------------------------------------------
# Este job fija el tag de imagen recien publicado y hace `kubectl apply -k`
# el mismo directamente contra EKS (push-based): mas simple de seguir que
# un flujo pull-based con un segundo sistema reconciliando en background;
# el costo es que el pipeline de CI necesita credenciales temporales con
# acceso al cluster (ver terraform/iam.tf: aws_eks_access_entry.gitlab_ci).
deploy:
  stage: deploy
  needs: ["build_push"]
  image: alpine:3.20
  <<: *aws_auth
  script:
    - apk add --no-cache make curl bash
    - curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
    - curl -sL "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
    - chmod +x /usr/local/bin/kubectl
    - aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
    - make deploy IMAGE_TAG=$CI_COMMIT_SHA

# ---------------------------------------------------------------------------
# 4. train (manual): descarga el dataset completo, entrena, y promueve a
#    "champion" en MLflow si supera el quality gate (ver core_ml/src/train.py)
# ---------------------------------------------------------------------------
train:
  stage: train
  when: manual
  needs: []
  <<: *aws_auth
  # MLFLOW_TRACKING_URI se toma de una variable de CI/CD del proyecto
  # (Settings > CI/CD > Variables) apuntando al MLflow compartido y
  # persistente (el mismo que sirve la API). Es imprescindible configurarla
  # con un endpoint alcanzable desde el runner; si no esta definida, se cae
  # a un SQLite efimero solo para no romper el job -- ese modo NO registra
  # nada en el Model Registry real que sirve la API.
  script:
    - pip install "poetry==${POETRY_VERSION}"
    - export MLFLOW_TRACKING_URI="${MLFLOW_TRACKING_URI:-sqlite:////tmp/mlflow.db}"
    - >
      if [ "$MLFLOW_TRACKING_URI" = "sqlite:////tmp/mlflow.db" ]; then
        echo "ADVERTENCIA: MLFLOW_TRACKING_URI no configurado; usando un tracking store SQLite efimero. Este modelo NO quedara disponible para la API.";
      fi
    - cd core_ml
    - poetry install
    - poetry run dvc pull
    - poetry run python src/prepare_training_data.py --data-dir data
    - poetry run python src/train.py --data-dir data --epochs 25 --patience 5
