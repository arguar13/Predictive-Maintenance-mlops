
stages:
  - data_pull
  - train
  - build
  - deploy

variables:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "040175285118"
  ECR_REPOSITORY: predictive-maintenance-mlops-streaming
  EKS_CLUSTER_NAME: mlops-cluster
  AWS_ROLE_ARN: arn:aws:iam::040175285118:role/GitLabCIRole

default:
  image: python:3.12-slim
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com

.aws_auth: &aws_auth
  before_script:
    - apt-get update && apt-get install -y awscli jq
    - >
      aws sts assume-role-with-web-identity 
      --role-arn $AWS_ROLE_ARN 
      --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" 
      --web-identity-token "$AWS_OIDC_TOKEN" > /tmp/assume-role.json
    - export AWS_ACCESS_KEY_ID=$(jq -r '.Credentials.AccessKeyId' /tmp/assume-role.json)
    - export AWS_SECRET_ACCESS_KEY=$(jq -r '.Credentials.SecretAccessKey' /tmp/assume-role.json)
    - export AWS_SESSION_TOKEN=$(jq -r '.Credentials.SessionToken' /tmp/assume-role.json)

pull_data:
  stage: data_pull
  <<: *aws_auth
  script:
    - pip install dvc dvc-s3
    - cd core_ml
    - dvc pull
  artifacts:
    paths:
      - core_ml/data/

train_model:
  stage: train
  <<: *aws_auth
  variables:
    MLFLOW_TRACKING_URI: "sqlite:////tmp/mlflow.db"
  script:
    - pip install poetry
    - cd core_ml
    - poetry install
    - poetry run python src/train.py
  rules:
    - when: always

build_image:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  <<: *aws_auth
  script:
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
    - docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$CI_COMMIT_SHA -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest .
    - docker push -a $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY

deploy_k8s:
  stage: deploy
  image: bitnami/kubectl:latest
  <<: *aws_auth
  script:
    - aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION
    - >
      sed -i "s|image: predictive-maintenance-streaming.*|image: $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest|g" kubernetes/02-mlops.yaml
    - kubectl apply -f kubernetes/01-config.yaml
    - kubectl apply -f kubernetes/02-mlops.yaml
    - kubectl rollout restart deployment streaming-consumer -n mlops-env
    - kubectl rollout restart deployment predictive-maintenance-api -n mlops-env