apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: mlops-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      # UID 472 ("grafana"): es el usuario con el que la imagen oficial ya
      # corre y el dueño de /var/lib/grafana.
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            # Con la raiz de solo lectura, Grafana necesita escribir su base
            # SQLite interna y sus plugins. emptyDir = dashboards creados a
            # mano se pierden al reiniciar; lo correcto en produccion es
            # provisionarlos como codigo (ConfigMap) o usar un PVC.
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: grafana-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: mlops-env
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
