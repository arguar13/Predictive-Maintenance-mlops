# NetworkPolicy por workload, no un default-deny generico: sin ninguna
# NetworkPolicy, cualquier pod del namespace puede hablarle a cualquier
# otro sin restriccion -- una API comprometida podria alcanzar mlflow (y
# por extension RDS/S3) igual de facil que un cliente legitimo. Alcance
# limitado a los dos workloads que quedan en este proyecto (api, mlflow):
# streaming-consumer/evidently/feast-materialize ya no existen (se quito
# todo el streaming Kafka de este proyecto).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-network-policy
  namespace: mlops-env
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Publica por diseño (Service type: LoadBalancer) - la superficie que
    # importa restringir aqui es a nivel de aplicacion (require_api_key en
    # api/main.py), no el origen de red. Omitir `from` permite cualquier
    # origen, restringido solo al puerto de la app.
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    # DNS: sin esto ningun otro egress de abajo funciona (todo resuelve
    # por nombre - mlflow, host.docker.internal en local, etc).
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # mlflow: carga del modelo/scaler al arrancar y en cada refresh
    # periodico (MODEL_REFRESH_SECONDS).
    - to:
        - podSelector:
            matchLabels:
              app: mlflow
      ports:
        - protocol: TCP
          port: 5000
    # APIs de AWS (S3 para los artefactos que mlflow.artifacts.download_artifacts
    # descarga directo, STS para IRSA). Los rangos de IP de los endpoints de
    # AWS son dinamicos y gestionados por AWS, no algo fijable en un CIDR
    # estable aqui - restringir por puerto (solo 443) es la superficie que
    # un NetworkPolicy puede cubrir de forma portable; IAM y Security Groups
    # ya cubren el resto.
    - ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlflow-network-policy
  namespace: mlops-env
spec:
  podSelector:
    matchLabels:
      app: mlflow
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # mlflow es ClusterIP (nunca se expone directo a internet en este
    # proyecto): solo pods del propio namespace, no cualquier origen.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-env
      ports:
        - protocol: TCP
          port: 5000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # RDS (backend store) + APIs de AWS (S3, artifact root). Mismo
    # razonamiento que en api-network-policy sobre por que 443 va sin CIDR.
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
