apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-consumer
  namespace: mlops-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streaming-consumer
  template:
    metadata:
      labels:
        app: streaming-consumer
    spec:
      serviceAccountName: mlops-sa
      # UID 10001 = usuario "appuser" de core_ml/Dockerfile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: consumer
          # Imagen propia (core_ml/Dockerfile): antes apuntaba a la misma
          # imagen que la API, que nunca incluyo streaming/ ni sus
          # dependencias (feast/torch/mlflow) -> crashloop garantizado.
          image: 040175285118.dkr.ecr.us-east-1.amazonaws.com/predictive-maintenance-mlops-consumer:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: mlops-config
          env:
            # Raiz de solo lectura: Feast (registro descargado de S3) y
            # MLflow (descarga del modelo "champion") necesitan un HOME y un
            # /tmp escribibles.
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: tmp
          emptyDir: {}
