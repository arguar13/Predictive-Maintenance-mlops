apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# secret.yaml NO se incluye: es solo una plantilla. El Secret real
# (mlops-secrets) se crea aparte con `kubectl create secret ...` (ver
# README, "Deploying to AWS"). Si estuviera en esta lista, cada
# `kubectl apply -k` (make deploy, job deploy de CI) sobrescribiria las
# credenciales reales con los placeholders "changeme".
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - mlflow.yaml
  - api.yaml
  - hpa.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: predictive-maintenance-mlops
      app.kubernetes.io/managed-by: kustomize
