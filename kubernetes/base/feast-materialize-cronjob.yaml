# Por que existe este CronJob: el job `train_model` de .gitlab-ci.yml corre
# `feast apply`, que SOLO registra el esquema (entities/feature views) en el
# registry de S3 -- nunca mueve datos al Online Store (Redis/ElastiCache).
# Sin un `feast materialize`, el Online Store queda permanentemente vacio y
# streaming-consumer nunca encuentra features para ningun engine_id
# (log "no_online_features" para el 100% de los mensajes).
#
# `feast materialize` no se puede correr desde el runner de CI/CD porque
# ElastiCache esta en subnets privadas sin acceso publico (mismo motivo que
# bootstrap_kafka_topics.py contra MSK, ver core_ml/scripts/bootstrap_kafka_topics.py):
# el runner, fuera de la VPC, no tiene ruta de red hacia el broker de Redis.
# Por eso la materializacion debe correr DENTRO del cluster.
#
# Se usa un CronJob (no un Job unico post-`train_model`) porque el
# FeatureView tiene ttl=1 dia (core_ml/feature_store/features.py): sin
# refrescos periodicos, cualquier fila materializada expiraria del Online
# Store 24h despues de la ultima ejecucion de `train_model`, con el mismo
# sintoma. `materialize-incremental` es idempotente (solo procesa el rango
# desde el ultimo materialize hasta el timestamp dado), asi que correrlo cada
# 30 minutos es barato y mantiene el Online Store siempre fresco.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: feast-materialize
  namespace: mlops-env
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: feast-materialize
        spec:
          restartPolicy: Never
          serviceAccountName: mlops-sa
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: feast-materialize
              # Misma imagen que streaming-consumer: ya trae feast + el
              # redis-py driver del Online Store, sin necesidad de una imagen
              # dedicada.
              image: 040175285118.dkr.ecr.us-east-1.amazonaws.com/predictive-maintenance-mlops-consumer:latest
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              envFrom:
                - configMapRef:
                    name: mlops-config
              env:
                - name: HOME
                  value: /tmp
              command:
                - sh
                - -c
                - poetry run feast -c feature_store materialize-incremental "$(date -u +%Y-%m-%dT%H:%M:%S)"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "250m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
          volumes:
            - name: tmp
              emptyDir: {}
