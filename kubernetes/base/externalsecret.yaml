# Reemplaza el antiguo Secret con credenciales en texto plano commiteadas a
# git. Requiere External Secrets Operator instalado en el cluster:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
#
# El ClusterSecretStore usa la identidad IRSA del ServiceAccount mlops-sa
# (ver serviceaccount.yaml) para leer AWS Secrets Manager -- el mismo rol de
# terraform/iam.tf, cuya policy incluye secretsmanager:GetSecretValue sobre
# estos secretos.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: mlops-sa
            namespace: mlops-env
---
# Genera un Secret nativo de Kubernetes llamado "mlops-secrets" (mismo
# nombre que antes) a partir de AWS Secrets Manager, para que los
# Deployments existentes (envFrom -> secretRef: mlops-secrets) no necesiten
# ningún cambio.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlops-secrets
  namespace: mlops-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: mlops-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: predictive-maintenance-mlops/db-credentials
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: predictive-maintenance-mlops/db-credentials
        property: password
    - secretKey: POSTGRES_DB
      remoteRef:
        key: predictive-maintenance-mlops/db-credentials
        property: dbname
    # El repositorio esta en GitLab: la clave se llama GIT_REPO_TOKEN, no
    # GITHUB_TOKEN. La consume monitoring/evidently_service.py para disparar
    # el pipeline de reentrenamiento cuando detecta drift.
    - secretKey: GIT_REPO_TOKEN
      remoteRef:
        key: predictive-maintenance-mlops/git-token
        property: token
    # Consumida por api/main.py::require_api_key para autenticar /predict
    # (terraform/secrets.tf genera el valor con random_password, nadie lo
    # elige ni lo commitea).
    - secretKey: API_KEY
      remoteRef:
        key: predictive-maintenance-mlops/api-key
        property: api_key
