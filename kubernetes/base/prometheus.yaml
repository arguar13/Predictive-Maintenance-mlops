apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: mlops-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      # UID 65534 ("nobody"): es el usuario con el que la imagen oficial
      # prom/prometheus ya corre, y el dueño de /prometheus en la imagen.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 9090
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: prometheus-config-volume
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            # Con la raiz de solo lectura, la TSDB necesita su propio volumen
            # escribible. emptyDir = las metricas no sobreviven al reinicio
            # del pod; para retencion real, sustituir por un
            # PersistentVolumeClaim (gp3) antes de operar en produccion.
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config-volume
          configMap:
            # Nombre generado por Kustomize (configMapGenerator, ver
            # kustomization.yaml) a partir de monitoring/prometheus.yml real
            # del repo -- nunca se duplica el contenido a mano.
            name: prometheus-config
        - name: prometheus-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: mlops-env
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
