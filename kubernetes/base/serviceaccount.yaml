# ServiceAccount plano, sin anotaciones IRSA. Los pods que lo usan (api,
# mlflow) llegan a S3 a traves del rol de instancia del node group de EKS
# (ver terraform/eks.tf + terraform/iam.tf::aws_iam_policy.node_s3_access),
# no de un rol IAM propio ligado a este Service Account. Anotar este
# ServiceAccount con `eks.amazonaws.com/role-arn` y un rol IAM dedicado
# (IRSA) es la mejora obvia si cada servicio necesita solo los permisos de
# AWS que usa, no los del nodo entero.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-sa
  namespace: mlops-env
