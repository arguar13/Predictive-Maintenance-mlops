# IRSA (IAM Roles for Service Accounts): la anotacion eks.amazonaws.com/role-arn
# va en el ServiceAccount, NO en la plantilla de cada Pod (los manifiestos
# anteriores la ponian, sin efecto, en metadata.annotations del Deployment).
# El rol referenciado aqui es el que crea terraform/iam.tf
# (module.iam_eks_role, trust policy con namespace_service_accounts =
# ["mlops-env:mlops-sa"]) -- ambos deben coincidir.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-sa
  namespace: mlops-env
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::040175285118:role/predictive-maintenance-mlops-s3-access-role-v2
