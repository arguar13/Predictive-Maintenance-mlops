# Secret nativo de Kubernetes con las credenciales de RDS/MLflow y la API
# key de /predict: simple de operar y depurar. Kubernetes cifra los Secrets
# en reposo con la clave de etcd del cluster (gestionada por AWS en EKS); no
# hay rotacion automatica ni un audit trail de quien leyo el valor, que si
# tendrias con un secret manager dedicado -- la mejora obvia si eso se
# vuelve un requisito.
#
# PLANTILLA: este archivo NO forma parte de kustomization.yaml, asi que
# `kubectl apply -k` nunca lo aplica ni pisa el Secret real. Documenta las
# claves que esperan los pods (envFrom: secretRef: mlops-secrets). El Secret
# real se crea una vez por cluster, fuera de git (ver README.md, seccion
# "Deploying to AWS"):
#
#   kubectl create secret generic mlops-secrets -n mlops-env \
#     --from-literal=POSTGRES_USER="$(terraform -chdir=terraform output -raw db_username)" \
#     --from-literal=POSTGRES_PASSWORD="$(terraform -chdir=terraform output -raw db_password)" \
#     --from-literal=POSTGRES_DB=mlflow_db \
#     --from-literal=API_KEY="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# NUNCA commitees los valores reales a git.
apiVersion: v1
kind: Secret
metadata:
  name: mlops-secrets
  namespace: mlops-env
type: Opaque
stringData:
  POSTGRES_USER: "changeme"
  POSTGRES_PASSWORD: "changeme"
  POSTGRES_DB: "mlflow_db"
  API_KEY: "changeme"
