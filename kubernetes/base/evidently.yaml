apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidently-service
  namespace: mlops-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evidently-service
  template:
    metadata:
      labels:
        app: evidently-service
    spec:
      serviceAccountName: mlops-sa
      # UID 10001 = usuario "appuser" de monitoring/Dockerfile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: evidently
          image: 040175285118.dkr.ecr.us-east-1.amazonaws.com/predictive-maintenance-mlops-monitoring:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: mlops-config
            # GIT_REPO_TOKEN (PAT de GitLab): monitoring/evidently_service.py
            # lo usa para disparar un pipeline de reentrenamiento (POST
            # /projects/:id/pipeline) cuando detecta data drift.
            - secretRef:
                name: mlops-secrets
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  # Nombre con guion (no "evidently_service"): los nombres de Service de
  # Kubernetes deben ser labels RFC 1123 validos, que no admiten guion bajo.
  # kubernetes/base/prometheus.yml usa este mismo nombre como scrape target.
  name: evidently-service
  namespace: mlops-env
spec:
  selector:
    app: evidently-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
