apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      serviceAccountName: mlops-sa
      # La imagen upstream de MLflow corre como root por defecto. Aqui se
      # fuerza el mismo UID no privilegiado que el resto del proyecto; el
      # servidor no necesita escribir en la raiz porque el backend store es
      # RDS y el artifact root es S3.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          # Imagen propia (Dockerfile.mlflow, publicada por el pipeline a ECR),
          # NO la imagen publica ghcr.io/mlflow/mlflow: esta ultima no trae
          # psycopg2, y backend-store-uri de abajo es Postgres/RDS -- el
          # server crashea en el arranque con ModuleNotFoundError: psycopg2.
          # kustomize edit set image (make gitops-set-image/release) fija el
          # tag real; kubernetes/overlays/production declara el newName.
          image: 040175285118.dkr.ecr.us-east-1.amazonaws.com/predictive-maintenance-mlops-mlflow:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["mlflow", "server"]
          args:
            - "--host=0.0.0.0"
            - "--port=5000"
            - "--backend-store-uri=postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):5432/$(POSTGRES_DB)"
            # Debe coincidir con `terraform output s3_bucket_name` (terraform/s3.tf).
            - "--default-artifact-root=s3://predictive-maintenance-mlops-artifacts-040175285118"
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: mlops-config
            - secretRef:
                name: mlops-secrets
          env:
            - name: HOME
              value: /tmp
            # MLflow >=3 rechaza por defecto cualquier Host header que no sea
            # localhost/127.0.0.1/una IP privada literal (proteccion anti DNS
            # rebinding). api y streaming-consumer llaman a este servidor
            # como "http://mlflow:5000" (DNS del Service de Kubernetes), que
            # no matchea esos patrones por defecto -> 403 "Invalid Host
            # header". Se declara explicitamente el nombre corto y el FQDN
            # del Service como permitidos (mismo problema que en
            # docker-compose.yml, ver su comentario).
            #
            # host.docker.internal(:*): el job train_model del runner
            # self-hosted (fuera del cluster, en el hardware que ejecuta
            # runner/docker-compose.yml) llega a este Service via
            # `kubectl port-forward svc/mlflow 5000:5000` + ese nombre DNS
            # especial de Docker Desktop hacia el host -- mismo 403 sin esto.
            - name: MLFLOW_SERVER_ALLOWED_HOSTS
              value: "mlflow,mlflow:*,mlflow.mlops-env,mlflow.mlops-env:*,mlflow.mlops-env.svc.cluster.local,mlflow.mlops-env.svc.cluster.local:*,host.docker.internal,host.docker.internal:*"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Sin requests/limits el pod es BestEffort: es el primero que el
          # kubelet desaloja bajo presion de memoria, justo cuando mas falta
          # hace el tracking server (KSV-0011/0015/0016/0018).
          # 1Gi de limite producia OOMKilled en el arranque real contra
          # Postgres/RDS (los nodos EKS son t3.large, 8GiB, hay margen de sobra).
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops-env
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
