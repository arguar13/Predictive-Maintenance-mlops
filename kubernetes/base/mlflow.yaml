apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      serviceAccountName: mlops-sa
      # La imagen upstream de MLflow corre como root por defecto. Aqui se
      # fuerza el mismo UID no privilegiado que el resto del proyecto; el
      # servidor no necesita escribir en la raiz porque el backend store es
      # RDS y el artifact root es S3.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.15.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["mlflow", "server"]
          args:
            - "--host=0.0.0.0"
            - "--port=5000"
            - "--backend-store-uri=postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):5432/$(POSTGRES_DB)"
            # Debe coincidir con `terraform output s3_bucket_name` (terraform/s3.tf).
            - "--default-artifact-root=s3://predictive-maintenance-mlops-artifacts-040175285118"
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: mlops-config
            - secretRef:
                name: mlops-secrets
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Sin requests/limits el pod es BestEffort: es el primero que el
          # kubelet desaloja bajo presion de memoria, justo cuando mas falta
          # hace el tracking server (KSV-0011/0015/0016/0018).
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops-env
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
