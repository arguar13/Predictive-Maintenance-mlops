---
# Configuración de yamllint para validación shift-left de YAML
# (Kubernetes manifests, GitLab CI, docker-compose, configs de la app, etc.)
extends: default

ignore: |
  core_ml/data/
  core_ml/.dvc/
  terraform/.terraform/
  mlruns/
  models/
  **/__pycache__/
  **/.venv/

rules:
  # Las líneas largas en .gitlab-ci.yml corresponden a comandos de shell
  # embebidos (AWS CLI, sed, etc.) que no se benefician de un límite fijo.
  line-length: disable
  # No exigimos que cada YAML empiece con "---": muchos son manifiestos
  # de un solo documento (config.yaml, feature_store.yaml, prometheus.yml).
  document-start: disable
  truthy:
    check-keys: false
  # `kustomize edit set image` (kubernetes/overlays/production, ver Makefile
  # gitops-set-image) reescribe las listas SIN indentar bajo su clave padre;
  # "whatever" acepta ambos estilos (con o sin indentar), siempre que cada
  # bloque sea internamente consistente, para no pelear con la salida propia
  # de la herramienta declarativa que reemplaza a sed.
  indentation:
    indent-sequences: whatever
