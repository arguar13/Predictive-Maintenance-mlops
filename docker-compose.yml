# Levanta TODOS los componentes -- Postgres, MLflow, la API y LocalStack
# ("la nube falsa") -- como contenedores efimeros en la maquina local, para
# validar que se entienden entre si antes de tocar RDS/EKS/S3 reales en AWS.
#
# Uso:
#   docker compose up -d          # levanta todo el stack
#   make train-toy                # (fuera de compose) entrena y registra un
#                                  # modelo "champion" contra este MLflow local
#   docker compose restart api    # la API vuelve a cargar el modelo recien registrado
#
# La API arranca sin modelo (healthcheck en rojo) hasta que exista un modelo
# con el alias "champion" en el Model Registry de este MLflow local -- es
# el comportamiento esperado, no un fallo del stack.

services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: mlflow_user
      POSTGRES_PASSWORD: mlflow_password
      POSTGRES_DB: mlflow_db
    ports:
      # Puerto de host 5433 (no 5432): esta maquina corre varios proyectos
      # MLOps del mismo curso en paralelo y 5432 ya esta tomado por otro.
      # La comunicacion entre contenedores (mlflow -> postgres:5432) usa el
      # puerto interno del contenedor y no se ve afectada por este remapeo.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow_user -d mlflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    # Imagen oficial de MLflow tal cual, sin build propio. No trae driver de
    # Postgres (psycopg2) instalado -- por eso el "command" de abajo lo
    # instala con pip antes de arrancar el server. Es mas simple de mantener
    # que una imagen propia (sin Dockerfile.mlflow que versionar/publicar),
    # a costa de un arranque un poco mas lento (pip install en cada start).
    image: ghcr.io/mlflow/mlflow:v3.15.1
    command: >
      bash -c "pip install --no-cache-dir psycopg2-binary==2.9.9 &&
      mlflow server
      --host 0.0.0.0
      --backend-store-uri postgresql://mlflow_user:mlflow_password@postgres:5432/mlflow_db
      --serve-artifacts
      --artifacts-destination /mlruns"
    environment:
      # MLflow >=3 rechaza por defecto cualquier Host header que no sea
      # localhost/127.0.0.1/una IP privada literal (proteccion anti DNS
      # rebinding). El servicio "api" llama a este servidor como
      # "http://mlflow:5000" (DNS interno de compose), que no matchea esos
      # patrones por defecto -> 403 "Invalid Host header". Hay que declarar
      # explicitamente el hostname del servicio como permitido.
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow,mlflow:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*"
    ports:
      # 5001 en el host (no 5000): mismo motivo que postgres arriba, otro
      # proyecto de este curso ya ocupa 5000. El puerto interno del
      # contenedor sigue siendo 5000 (ver MLFLOW_TRACKING_URI del servicio api).
      - "5001:5000"
    volumes:
      - ./mlruns:/mlruns
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Sin curl (la imagen oficial no lo trae): se usa el propio interprete
      # de Python de la imagen para pegarle a /health.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # LocalStack: "la nube falsa". Simula S3 (remoto de DVC, artefactos de
  # MLflow) localmente, sin credenciales ni costes reales de AWS. Ver
  # localstack/init-aws.sh para los recursos que se bootstrapean
  # automaticamente (mismo nombre de bucket que en terraform/s3.tf).
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PERSISTENCE: 0
    ports:
      # 4567 en el host (no 4566): mismo motivo que postgres/mlflow arriba.
      - "4567:4566"
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  # API de serving (FastAPI). Carga el modelo "champion" desde el MLflow de
  # este stack -- ver la nota de arranque al inicio de este archivo.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # /predict exige X-API-Key (api/main.py::require_api_key). Valor fijo
      # SOLO para este stack local; en K8s llega desde un Secret de
      # Kubernetes (kubernetes/base/secret.yaml), nunca este literal.
      API_KEY: local-dev-only-key-change-me
    ports:
      # 8001 en el host (no 8000): mismo motivo que postgres/mlflow arriba.
      - "8001:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  localstack_data:
