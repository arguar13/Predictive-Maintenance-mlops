project:
  name: "predictive_maintenance_turbofan"
  version: "2.0.0"

model:
  # Unico parametro de forma que es una decision de diseño: lo leen
  # prepare_training_data.py (ventaneo) y train.py (reshape). El numero de
  # features NO se declara aqui a proposito: depende de los datos (los
  # sensores invariantes se descartan en data_processing.clean_and_prepare)
  # y su fuente de verdad es el scaler registrado junto al modelo en MLflow.
  # Declararlo a mano ya produjo un desajuste real (14 en config vs 24 en el
  # modelo entrenado) que dejaba /predict inservible.
  window_size: 30
  mlflow_tracking_uri: "${MLFLOW_TRACKING_URI}"  # Inyectado por K8s / compose
  model_name: "Turbofan_FCN"

monitoring:
  # Quality gate: reemplaza un umbral de accuracy plano. RUL tiene 3 clases
  # desbalanceadas (Healthy/Alert/Critical) con costo asimetrico -- un falso
  # negativo de "Critical" (el modelo dice Healthy/Alert de un motor que en
  # realidad esta a punto de fallar) es mucho mas caro que un falso
  # positivo -- asi que el gate no puede ser ciego a esa asimetria. F2
  # pondera el recall el doble que la precision sobre las 3 clases;
  # critical_recall_threshold es un piso duro INDEPENDIENTE sobre la clase
  # Critical especificamente: un modelo puede tener buen F2 global y aun asi
  # fallar sistematicamente en detectar justo el caso que mas importa, y el
  # gate debe rechazarlo igual.
  f2_weighted_threshold: 0.75
  critical_recall_threshold: 0.75
