project:
  name: "predictive_maintenance_turbofan"
  version: "2.0.0"

model:
  window_size: 30
  # 24 = sensores + operating settings que sobreviven clean_and_prepare()
  # sobre el dataset COMPLETO (FD001-FD004 combinados, ver
  # core_ml/src/data_processing.py): al combinar las 4 sub-series (6
  # condiciones operativas distintas) ningun sensor resulta invariante. El
  # valor historico (14) correspondia solo a data_toy/ (unicamente
  # train_FD001.txt, una sola condicion operativa, con 7 sensores
  # invariantes descartados) y quedo desactualizado tras entrenar en
  # produccion contra el dataset completo (confirmado via GET /health:
  # {"num_features": 24} del modelo champion real). api/main.py ya no
  # depende de este valor (infiere la forma real desde el scaler del
  # modelo servido, ver api/main.py::_infer_window_shape).
  num_features: 24
  mlflow_tracking_uri: "${MLFLOW_TRACKING_URI}"  # Inyectado por K8s
  model_name: "Turbofan_FCN"

monitoring:
  # Quality gate: reemplaza un umbral de accuracy plano. RUL tiene 3 clases
  # desbalanceadas (Healthy/Alert/Critical) con costo asimetrico -- un falso
  # negativo de "Critical" (el modelo dice Healthy/Alert de un motor que en
  # realidad esta a punto de fallar) es mucho mas caro que un falso
  # positivo -- asi que el gate no puede ser ciego a esa asimetria. F2
  # pondera el recall el doble que la precision sobre las 3 clases;
  # critical_recall_threshold es un piso duro INDEPENDIENTE sobre la clase
  # Critical especificamente: un modelo puede tener buen F2 global y aun asi
  # fallar sistematicamente en detectar justo el caso que mas importa, y el
  # gate debe rechazarlo igual.
  f2_weighted_threshold: 0.75
  critical_recall_threshold: 0.75
