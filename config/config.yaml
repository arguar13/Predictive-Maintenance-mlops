project:
  name: "predictive_maintenance_turbofan"
  version: "2.0.0"

kafka:
  broker: "localhost:9092"
  telemetry_topic: "engine_telemetry"
  alert_topic: "engine_alerts"

model:
  window_size: 30
  num_features: 14
  mlflow_tracking_uri: "http://localhost:5000"
  model_name: "Turbofan_FCN"

monitoring:
  prometheus_port: 8000
  drift_threshold: 0.05 # Si el p-value baja de 0.05, hay Data Drift
  accuracy_threshold: 0.85 # Umbral para Concept Drift