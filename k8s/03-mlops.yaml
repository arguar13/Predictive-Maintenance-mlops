# --- MLFLOW ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:latest
          command: ["mlflow", "server"]
          args:
            - "--host=0.0.0.0"
            - "--port=5000"
            - "--backend-store-uri=sqlite:///mlflow.db"
            - "--default-artifact-root=/mlflow/artifacts"
          ports:
            - containerPort: 5000

          env:
            - name: MLFLOW_SERVER_HOST
              value: "0.0.0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops-env
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000

---
# --- STREAMING CONSUMER (Tu código Python) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-consumer
  namespace: mlops-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streaming-consumer
  template:
    metadata:
      labels:
        app: streaming-consumer
    spec:
      containers:
        - name: consumer
          image: predictive-maintenance-streaming:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "streaming/kafka_consumer.py"]
          envFrom:
            - configMapRef:
                name: mlops-config
          # Buenas prácticas: Límites de consumo
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-consumer
  namespace: mlops-env
spec:
  selector:
    app: streaming-consumer
  ports:
    - port: 8000
      targetPort: 8000

---
# --- API (FastAPI) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictive-maintenance-api
  namespace: mlops-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: predictive-maintenance-api
          image: predictive-maintenance-streaming:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"] # NOTA: Cambié src.main a api.main según tu carpeta
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: mlops-config
---
apiVersion: v1
kind: Service
metadata:
  name: predictive-maintenance-api
  namespace: mlops-env
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30081