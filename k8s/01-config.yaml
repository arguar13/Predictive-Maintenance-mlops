apiVersion: v1
kind: Namespace
metadata:
  name: mlops-env
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlops-config
  namespace: mlops-env
data:
  KAFKA_BROKER: "kafka:9092"
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  # Nuevas variables para AWS / LocalStack
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  AWS_DEFAULT_REGION: "us-east-1"
  MLFLOW_S3_ENDPOINT_URL: "http://host.minikube.internal:4566"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mlops-env
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'evidently_drift_monitor'
        static_configs:
          - targets: ['streaming-consumer:8000']