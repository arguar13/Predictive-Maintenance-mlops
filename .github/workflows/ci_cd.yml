name: MLOps Retraining CI/CD Pipeline (AWS)

on:
  repository_dispatch:
    types: [model_retrained]
  push:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: predictive-maintenance-streaming
  MLFLOW_TRACKING_URI: http://host.minikube.internal:5000 # Si corres 'act' localmente
  AWS_ENDPOINT_URL: http://host.minikube.internal:4566    # Endpoint de LocalStack

jobs:
  retrain_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest dvc dvc-s3 # Cambiado a dvc-s3

      # 1. Configurar AWS Credentials (Apuntando a LocalStack)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: test
          aws-secret-access-key: test
          aws-region: ${{ env.AWS_REGION }}

      # 2. Pull Data con DVC desde S3 (LocalStack)
      - name: Pull Data with DVC
        env:
          AWS_ENDPOINT_URL: ${{ env.AWS_ENDPOINT_URL }}
        run: dvc pull

      # 3. Entrenar Modelo
      - name: Run Model Retraining
        run: python train.py

      # 4. Login a Amazon ECR (Omitido/simulado si usas LocalStack estrictamente)
      # En AWS real usarías aws-actions/amazon-ecr-login@v1

      # 5. Build & Push a ECR LocalStack (o registro interno de Minikube)
      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="localhost:4566/predictive-maintenance-streaming:latest"
          docker build -t $IMAGE_TAG .
          # Si usas minikube, en lugar de push, inyectas la imagen directamente:
          # minikube image load $IMAGE_TAG

      # 6. Despliegue en Kubernetes (Reemplaza a Cloud Run)
      - name: Deploy to Minikube/EKS
        run: |
          # Reinicia el deployment para forzar la actualización de la imagen
          kubectl rollout restart deployment streaming-consumer -n mlops-env
          kubectl rollout restart deployment predictive-maintenance-api -n mlops-env