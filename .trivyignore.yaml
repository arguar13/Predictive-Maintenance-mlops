# Aceptaciones de riesgo explicitas y auditables para el escaneo de trivy
# (`make security`, y el mismo comando en el stage "quality" de GitLab CI).
#
# Regla de uso: aqui SOLO entran hallazgos que (a) estan dentro de modulos de
# terceros que este repositorio no puede editar, y (b) no se pueden corregir
# desde las variables de entrada del modulo sin romper una capacidad que el
# proyecto necesita. Todo lo demas se corrige en el codigo, no se silencia.
# Cada entrada lleva fecha de caducidad: al vencer, el hallazgo vuelve a
# romper la build y hay que revisar la decision, no renovarla por inercia.

misconfigurations:
  - id: AWS-0040
    paths:
      - "terraform-aws-modules/eks/aws/main.tf"
      - "terraform-aws-modules/eks/aws/.terraform/modules/eks/main.tf"
    statement: >-
      "EKS Clusters should have the public access disabled". El endpoint publico
      del api-server se mantiene habilitado de forma deliberada: hacerlo privado
      obligaria a un bastion o a una VPN de sitio para cualquier `kubectl`, y
      este proyecto no provisiona ninguno de los dos. El riesgo real (api-server
      expuesto a todo Internet) SI esta mitigado: terraform/eks.tf restringe
      cluster_endpoint_public_access_cidrs a la IP del operador
      (var.cluster_public_access_cidrs), nunca 0.0.0.0/0. ArgoCD, que es quien
      realmente despliega, corre dentro del cluster y usa el endpoint interno.
    expired_at: 2027-02-28

  - id: AWS-0104
    paths:
      - "terraform-aws-modules/eks/aws/node_groups.tf"
      - "terraform-aws-modules/eks/aws/.terraform/modules/eks/node_groups.tf"
    statement: >-
      "A security group rule should not allow unrestricted egress". Es el
      security group del managed node group, creado dentro del modulo oficial
      de AWS. Los nodos de EKS necesitan salida a Internet para descargar
      imagenes de ECR/registries publicos, hablar con el plano de control y
      resolver DNS; el modulo no expone una variable para acotar esa regla sin
      reescribir el security group completo por fuera. La salida atraviesa el
      NAT Gateway de la VPC privada (terraform/vpc.tf), no una IP publica por
      nodo.
    expired_at: 2027-02-28

  - id: AWS-0041
    paths:
      - "terraform-aws-modules/eks/aws/main.tf"
      - "terraform-aws-modules/eks/aws/.terraform/modules/eks/main.tf"
    statement: >-
      "EKS cluster should not have open CIDR range for public access". El check
      falla ante CUALQUIER CIDR publica, incluida una /32: no distingue entre
      0.0.0.0/0 y la IP unica del operador. Aqui la lista es exactamente
      var.cluster_public_access_cidrs (por defecto una sola /32, ver
      terraform/variables.tf), que es la mitigacion que el propio check
      persigue. Va junto a AWS-0040 por el mismo motivo y con la misma fecha
      de revision.
    expired_at: 2027-02-28

  - id: AWS-0031
    paths:
      - "terraform/ecr.tf"
    statement: >-
      "Repository tags are mutable", unicamente para
      aws_ecr_repository.build_cache. A diferencia de los otros 4 repos ECR
      de este archivo (imagenes de release, correctamente IMMUTABLE), este
      repo nunca se despliega: solo lo lee/escribe `docker buildx build
      --cache-from/--cache-to type=registry,...,mode=max` (ver Makefile,
      target docker-buildx-push-*) para cachear capas de dependencias
      pesadas (torch) entre corridas del job build_image, cuyo servicio dind
      es efimero. Ese exporter de cache reescribe el MISMO tag en cada
      build por diseño; con IMMUTABLE, el segundo push del mismo tag
      fallaria con ImageTagAlreadyExists y el cache dejaria de funcionar.
      Ningun Deployment de kubernetes/ referencia jamas una imagen de este
      repo.
    expired_at: 2027-02-28

vulnerabilities:
  - id: CVE-2026-69247
    paths:
      - "api/poetry.lock"
      - "core_ml/poetry.lock"
    statement: >-
      cryptography 49.0.0. La correccion esta en 50.0.0, pero mlflow 3.15.x
      declara cryptography (>=43.0.0,<50): elevarla hace que la resolucion de
      Poetry falle. No es una decision de este repositorio, es una cota de
      la dependencia principal del proyecto (MLflow es el Model Registry, no
      es sustituible). Revisar cuando MLflow relaje la cota; entonces basta
      con quitar esta entrada y volver a lockear.
    expired_at: 2027-02-28
