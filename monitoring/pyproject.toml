[tool.poetry]
name = "predictive-maintenance-monitoring"
version = "1.0.0"
description = "Servicio de deteccion de drift (Evidently + Kafka + Prometheus)"
authors = ["Tu Nombre <tu@email.com>"]
package-mode = false

[tool.poetry.dependencies]
# Proyecto Poetry propio, independiente de core_ml/ (mismo criterio que
# api/: "Two independent Poetry projects instead of one shared dependency
# tree", ver README). evidently_service.py solo necesita esta lista -- nunca
# importa torch/feast/dvc/mlflow/sklearn/testcontainers, que core_ml/
# arrastra para entrenamiento. Heredar todo core_ml/poetry.lock aqui
# (Dockerfile anterior) triplicaba la descarga/subida de esas dependencias
# pesadas (compartidas tambien por el Dockerfile de la API y el del
# streaming-consumer) sin que este servicio las usara nunca.
python = ">=3.12,<3.13"
pandas = ">=2.2.2"
numpy = ">=2.0.0"
requests = "^2.31.0"
evidently = ">=0.4.30"
kafka-python-ng = "^2.2.2"
prometheus-client = ">=0.20.0,<0.25.0"
pydantic = "^2.9.0"
structlog = "^26.1.0"
pyyaml = "^6.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
