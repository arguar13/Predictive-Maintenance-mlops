# Estado deseado de Kubernetes vive en git (GitOps): ArgoCD vigila
# kubernetes/overlays/production en ESTE repo y reconcilia el cluster para
# que coincida -- ni el pipeline de CI ni nadie corre `kubectl apply`/
# `kubectl rollout restart` a mano contra el cluster nunca mas.
#
# Instalacion de ArgoCD (una sola vez por cluster):
#   kubectl create namespace argocd
#   kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml --server-side --force-conflicts
#
# "stable" (no una version anclada como v2.13.2) porque el calculo de diff de
# ArgoCD depende de su propio esquema interno de tipos de Kubernetes: una
# version de ArgoCD mas vieja que el cluster no reconoce campos nuevos del
# API (p.ej. Deployment.status.terminatingReplicas, agregado en Kubernetes
# 1.33+) y el sync queda en SYNC STATUS "Unknown" con
# "error building typed value from live resource: <campo> not declared in
# schema". --server-side --force-conflicts: el install.yaml incluye CRDs
# (ApplicationSet) cuyo esquema OpenAPI excede el limite de 262144 bytes de
# la annotation kubectl.kubernetes.io/last-applied-configuration que usa un
# `apply` normal.
#
# Registrar esta aplicacion:
#   kubectl apply -f gitops/argocd/application.yaml
#
# A partir de ahi, el UNICO cambio que hace el pipeline de CI es actualizar
# el tag de imagen en kubernetes/overlays/production/kustomization.yaml y
# commitearlo (`make gitops-set-image` + `make gitops-release`, ver
# .gitlab-ci.yml stage "release") -- ArgoCD detecta el commit y sincroniza.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: predictive-maintenance-mlops
  namespace: argocd
  finalizers:
    # Al borrar la Application, tambien borra los recursos que gestiona en
    # el cluster (evita huerfanos si algun dia se retira el proyecto).
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://gitlab.com/personal-group7745334/predictive-maintenance-mlops.git
    targetRevision: dev
    path: kubernetes/overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: mlops-env

  syncPolicy:
    automated:
      # prune: borra en el cluster lo que ya no esta en git.
      # selfHeal: revierte cambios manuales (kubectl edit/patch) que
      # diverjan del estado declarado -- ningun despliegue "a ciegas" ni
      # deriva silenciosa.
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false  # namespace.yaml (Kustomize) ya lo declara
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
