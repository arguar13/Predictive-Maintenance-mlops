# Runner self-hosted de GitLab CI/CD (Fase "cero minutos en la nube").
#
# Ejecuta los jobs de .gitlab-ci.yml en este mismo hardware en vez de en los
# shared runners de gitlab.com. El token de registro NUNCA se escribe en el
# repo: `gitlab-runner register` lo guarda en el volumen nombrado
# `gitlab-runner-config` (solo en este host). Ver Makefile: runner-register,
# runner-up, runner-down, runner-status, runner-logs.
#
# Executor: docker, con --docker-privileged=true (fijado en el registro) para
# que el job build_image (que usa el servicio docker:24.0.5-dind) pueda
# arrancar su propio daemon Docker anidado. El socket del host se monta para
# que el propio contenedor gitlab-runner pueda crear los contenedores de cada
# job (patron oficial "Docker socket binding").
services:
  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: gitlab-runner
    restart: unless-stopped
    volumes:
      - gitlab-runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  gitlab-runner-config:
