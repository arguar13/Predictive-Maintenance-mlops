[tool.poetry]
name = "predictive-maintenance-data"
version = "2.0.0"
description = "Data Pipeline y Entrenamiento de Modelos MLOps"
authors = ["Tu Nombre <tu@email.com>"]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
# Data Engineering
pandas = ">=2.2.2" # Actualizado para ser compatible con Numpy 2.0+
numpy = ">=2.0.0"
pyarrow = ">=14.0.0"
pydantic = "^2.9.0"
pandera = {extras = ["pandas"], version = ">=0.24.0,<1.0.0"} # Data contracts
dvc = {extras = ["s3"], version = "^3.0.0"} # DVC restaurado y compatible
boto3 = ">=1.38.27"
sqlalchemy = "^1.4.54"

# Machine Learning
scikit-learn = ">=1.4.0"
psycopg2-binary = "2.9.9"
requests = "^2.31.0"
matplotlib = "^3.9.2"
seaborn = "^0.13.2"
# Rueda CPU-only (ver [[tool.poetry.source]] "pytorch-cpu" mas abajo): nada en
# este proyecto llama a CUDA (entrenamiento del toy dataset y del dataset
# completo corren en CPU, ver README "sin GPU"). La rueda de PyPI por defecto
# para Linux arrastra ~2GB de paquetes nvidia-* (cufft, cublas, cudnn,
# nvshmem...) que no se usan nunca y que en redes lentas/CI hacen fallar el
# build de Docker por timeout de lectura contra files.pythonhosted.org.
torch = {version = "^2.13.0", source = "pytorch-cpu"}
mlflow = "^3.15.1"
dvc-s3 = "^3.3.0"

# Observabilidad
structlog = "^26.1.0" # logging JSON estructurado (CloudWatch/Elasticsearch)

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.4"
mypy = "^1.13.0"
types-pyyaml = "^6.0.12"
pytest = "^8.3.3"
pytest-cov = "^5.0.0"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Shift-left tooling configuration (calidad local)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data", "data_toy", ".dvc"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "C4", "SIM"]
ignore = []

[tool.ruff.format]
# ruff format reemplaza a black+isort (mismo estilo, una sola herramienta).

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["tests/", "data/", "data_toy/"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
