project: predictive_maintenance

registry:
  path: s3://predictive-maintenance-mlops-artifacts-040175285118/registry.pb

provider: aws

offline_store:
  type: file   # sin "path"

online_store:
  type: redis
  # ${REDIS_CONNECTION_STRING}: inyectada via kubernetes/base/configmap.yaml
  # (terraform/elasticache.tf -> output redis_connection_string) en EKS, y
  # "localhost:6379" (docker-compose.yml) en local -- Feast expande
  # variables de entorno con esta sintaxis de forma nativa.
  connection_string: "${REDIS_CONNECTION_STRING}"
